- One Tap Log — enregistrez les portions de vos boissons favorites en un geste
- Suivez votre consommation de caféine, d’eau, de sucre, de calories, de comprimés et d’alcool
- Retrouvez toutes vos boissons favorites dans l’app Apple Watch, sans avoir besoin de votre iPhone
- Synchronisation avec Apple Santé

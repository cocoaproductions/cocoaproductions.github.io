privacy:
  heading: Politique de confidentialité (mise à jour le 2 février 2024)
  access_heading: Accès à Apple Santé
  access_text: Caffeine++ fonctionne de manière optimale avec un accès en lecture et en écriture aux données de caféine, d’eau, de sucre et de calories.
  read_heading: Accès en lecture
  read_text: Cet accès nous permet d’afficher directement dans Caffeine++ la quantité de café que vous avez consommée. Nous stockons ces données uniquement en local et supprimons toutes celles datant de plus d’une semaine. Nous pouvons également afficher les données que vous saisissez manuellement dans Apple Santé ou que vous enregistrez avec d’autres apps de suivi de la caféine disponibles sur l’App Store.
  write_heading: Accès en écriture
  write_text: Cet accès nous permet d’enregistrer vos données dans Apple Santé pour les archiver. Vous pouvez refuser n’importe quelle autorisation d’écriture et utiliser uniquement le stockage de l’app. Toutefois, nous ne conservons vos données en local que pendant une semaine.
  summary_heading: Résumé de la politique de confidentialité
  summary:
  - Caffeine++ peut utiliser l’accès à Apple Santé pour stocker des données et afficher un récapitulatif quotidien.
  - Caffeine++ ne vous demande de saisir aucune information personnelle dans l’app.
  - Caffeine++ et ses créateurs ne peuvent être tenus responsables des données incorrectes saisies par l’utilisateur dans l’app.
  - Les données saisies par l’utilisateur dans Caffeine++ sont stockées uniquement sur son iPhone et, s’il le souhaite, sur les serveurs d’Apple.
  - Nous pouvons conserver votre adresse e-mail pendant un certain temps si vous nous envoyez une demande d’assistance par e-mail depuis l’app.

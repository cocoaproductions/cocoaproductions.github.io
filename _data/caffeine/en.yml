  heading: Privacy policy (updated 2 February 2024)
  access_heading: Apple Health access
  access_text: Caffeine++ works best with read and write access to caffeine, water, sugar, and calories data.
  read_heading: Read access
  read_text: Allows us to display how much coffee you had directly in Caffeine++. We only store this data locally and erase everything older than 1 week. We even can display data you manually enter in Apple Health or data you log through other caffeine trackers from the App Store.
  write_heading: Write access
  write_text: Allows us to save your data into Apple Health for archiving. You can deny any of the write permissions and rely only on the app storage, however, we store your data locally only for 1 week.
  summary_heading: Privacy summary
  summary:
  - Caffeine++ can use Apple Health access for storing data and displaying daily summary.
  - Caffeine++ doesn’t require any personal user details to be entered anywhere in the app.
  - Caffeine++ and its creators can not be held responsible for any incorrect user data entered in the app.
  - Any user generated data that is entered from Caffeine++ is only stored on a users iPhone and, optionally, on Apple servers.
